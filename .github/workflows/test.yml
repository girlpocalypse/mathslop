# Runs the test suite (CLAUDE.md "Tests") on pushes and pull requests. Nothing here is shipped.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # Chromium, not branded Chrome: Chrome no longer accepts --load-extension. A CI-time download, not a
      # project dependency.
      - name: Install Chromium
        run: |
          out=$(npx --yes @puppeteer/browsers@2 install chromium@latest --path "$RUNNER_TEMP/browsers")
          echo "CHROMIUM=$(echo "$out" | tail -1 | awk '{print $2}')" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm run coverage
        env:
          CHROMIUM_FLAGS: --no-sandbox   # Ubuntu runners restrict the user namespaces Chromium's sandbox needs
      - run: npm run test:zip
        env:
          CHROMIUM_FLAGS: --no-sandbox
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
