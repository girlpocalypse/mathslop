# Runs the test suite (CLAUDE.md "Tests") on pushes and pull requests. Nothing here is shipped.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # Chrome for Testing, not branded Chrome: Chrome no longer accepts --load-extension, Chrome for Testing
      # (and Chromium) still do. Pinned so CI doesn't change under us; a CI-time download, not a dependency.
      - name: Install Chrome for Testing
        run: |
          out=$(npx --yes @puppeteer/browsers@2 install chrome@156.0.8078.47 --path "$RUNNER_TEMP/browsers")
          echo "$out"
          echo "CHROMIUM=$(echo "$out" | tail -1 | awk '{print $2}')" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - name: What the test browser sees
        run: node test/tools/diagnose-browser.mjs
        env:
          CHROMIUM_FLAGS: --no-sandbox
          CHROMIUM_LOG: coverage/chromium
      - run: npm run coverage
        env:
          CHROMIUM_FLAGS: --no-sandbox   # Ubuntu runners restrict the user namespaces Chromium's sandbox needs
          CHROMIUM_LOG: coverage/chromium   # each browser's stderr, uploaded with coverage/
      - run: npm run test:zip
        env:
          CHROMIUM_FLAGS: --no-sandbox
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
